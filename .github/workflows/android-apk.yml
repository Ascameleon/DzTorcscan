name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torqscan-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Flutter source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="DzTorqscan_v1.4.0_complete.zip"
          if [ ! -f "$ARCHIVE" ]; then
            ARCHIVE="$(find . -maxdepth 1 -name 'DzTorqscan_source_recovery_*.zip' -print | sort -V | tail -n 1)"
          fi
          if [ -z "${ARCHIVE:-}" ] || [ ! -f "$ARCHIVE" ]; then
            echo "::error::No Dz Torqscan source archive found in repository root."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted
          PUBSPEC="$(find extracted -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "::error::No pubspec.yaml found in source archive; it may not contain a complete Flutter project."
            find extracted -maxdepth 3 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found at: $PROJECT_DIR"

      - name: Normalize Android build plugin versions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=""
          for candidate in android/settings.gradle android/settings.gradle.kts; do
            if [ -f "$candidate" ]; then SETTINGS="$candidate"; break; fi
          done
          if [ -z "$SETTINGS" ]; then
            echo "::error::Android settings.gradle not found."
            exit 1
          fi
          find android -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print0 |
            xargs -0 -r sed -i 's/9\.0\.0/8.9.1/g; s/2\.2\.10/2.2.20/g'
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$WRAPPER" ]; then
            echo "::warning::Gradle wrapper properties are missing; creating a compatible distribution configuration."
            mkdir -p "$(dirname "$WRAPPER")"
            cat > "$WRAPPER" <<'PROPERTIES'
            distributionBase=GRADLE_USER_HOME
            distributionPath=wrapper/dists
            distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
            networkTimeout=10000
            validateDistributionUrl=true
            zipStoreBase=GRADLE_USER_HOME
            zipStorePath=wrapper/dists
            PROPERTIES
          else
            sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.14.3-\1.zip#' "$WRAPPER"
          fi
          if [ ! -f android/gradlew ]; then
            echo "::error::Android Gradle launcher android/gradlew is missing from the source archive."
            exit 1
          fi
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::Gradle wrapper JAR is missing from the source archive."
            exit 1
          fi
          chmod +x android/gradlew
          echo "Gradle wrapper configuration:"
          cat "$WRAPPER"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Run automated tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "::warning::No Dart automated tests found. Hardware validation is still required."
          fi

      - name: Build installable Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Build Android App Bundle
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torqscan-dz-android
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
