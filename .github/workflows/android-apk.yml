name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract archived Flutter source if needed
        shell: bash
        run: |
          if [ ! -f pubspec.yaml ] && [ ! -f obd2_scanner/pubspec.yaml ]; then
            ARCHIVE="$(find . -maxdepth 1 -type f -name 'DzTorqscan_source_recovery_v*.zip' | sort -V | tail -n 1)"
            if [ -z "$ARCHIVE" ]; then echo "No Flutter source archive found" >&2; exit 1; fi
            unzip -oq "$ARCHIVE" -d .
          fi
      - name: Locate Flutter project
        shell: bash
        run: |
          if [ -f pubspec.yaml ]; then echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f obd2_scanner/pubspec.yaml ]; then echo "PROJECT_DIR=obd2_scanner" >> "$GITHUB_ENV"
          else echo "Flutter project pubspec.yaml not found" >&2; exit 1; fi
      - name: Static preflight
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f scripts/preflight.py ]; then python3 scripts/preflight.py; else echo "Preflight script unavailable; continuing to Flutter checks."; fi
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get
      - name: Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: flutter analyze --no-pub
      - name: Test
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: flutter test --no-pub
      - name: Ensure Android Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create . --platforms=android
          fi
          chmod +x android/gradlew
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --no-pub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DzTorqscan-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
