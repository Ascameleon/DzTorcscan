name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract v1.4.0 source
        run: |
          unzip -oq DzTorqscan_v1.4.0_complete.zip -d .
          if [ -f pubspec.yaml ]; then echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f obd2_scanner/pubspec.yaml ]; then echo "PROJECT_DIR=obd2_scanner" >> $GITHUB_ENV
          else echo "No pubspec" >&2; exit 1; fi
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DzTorqscan-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
