name: Android Release APK / AAB

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (ex: 1.4.1)'
        required: true
        type: string
      build_number:
        description: 'Version code (entier, ex: 15)'
        required: true
        type: string
  push:
    branches: [main, master]
    tags: ['v*']          # Déclenche auto sur tag v1.4.1
  pull_request:
    branches: [main, master]

permissions:
  contents: write         # Pour créer la Release GitHub + uploader assets
  actions: read
  id-token: write         # Pour OIDC si déploiement Play Store plus tard

env:
  FLUTTER_VERSION: '3.22.2'   # Fixe ta version stable
  JAVA_VERSION: '17'
  AGP_VERSION: '8.9.1'        # Verrouillé ici, plus de sed sauvage
  PROJECT_DIR: 'obd2_scanner' # Ton dossier Flutter réel (à confirmer)

jobs:
  build:
    name: Build ${{ matrix.variant }} (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: 'apk'
            api: '34'
            artifact: 'app-release.apk'
            build_args: '--release --target-platform android-arm,android-arm64,android-x64'
          - variant: 'aab'          # Format Play Store
            api: '34'
            artifact: 'app-release.aab'
            build_args: '--release'

    steps:
      # ─── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           # Nécessaire pour `git describe` / versioning auto

      # ─── Java & Flutter (avec cache natif) ────────────────────
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true              # Cache pub + gradle global
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}

      # ─── Détection projet (remplace ton unzip + find) ──────────
      - name
