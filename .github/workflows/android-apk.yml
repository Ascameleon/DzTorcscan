name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract v1.4.0 source
        run: |
          unzip -oq DzTorqscan_v1.4.0_complete.zip -d src
          cd src
          if [ -f pubspec.yaml ]; then echo "PROJECT_DIR=src" >> $GITHUB_ENV
          elif [ -f obd2_scanner/pubspec.yaml ]; then
            echo "PROJECT_DIR=src/obd2_scanner" >> $GITHUB_ENV
          else
            echo "No pubspec.yaml" >&2; exit 1
          fi
      - name: Prepare Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create . --platforms=android --project-name torqscan --org com.dztorqscan
          # Keep our app id / namespace
          sed -i 's/applicationId = .*/applicationId = "com.dztorqscan.app"/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/namespace = .*/namespace = "com.dztorqscan.app"/' android/app/build.gradle.kts 2>/dev/null || true
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId .*/applicationId "com.dztorqscan.app"/' android/app/build.gradle
            sed -i 's/namespace .*/namespace "com.dztorqscan.app"/' android/app/build.gradle
          fi
          # Permissions OBD
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'BLUETOOTH_CONNECT' "$MANIFEST"; then
            sed -i 's|<manifest|<manifest xmlns:tools="http://schemas.android.com/tools"|' "$MANIFEST"
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />' "$MANIFEST"
          fi
          chmod +x android/gradlew || true
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DzTorqscan-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
